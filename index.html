<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCU FORMULA CONCERT - Drink Randomizer</title>
    <!-- ใช้ฟอนต์ Prompt ซึ่งเป็นฟอนต์ไม่มีหัวที่ดูทันสมัย -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ffde00; /* สีเหลือง Formula */
            --bg-color: #0a0a0a;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ลายพื้นหลังสนามแข่ง */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, rgba(255, 222, 0, 0.05) 25%, transparent 25%),
                        linear-gradient(-45deg, rgba(255, 222, 0, 0.05) 25%, transparent 25%);
            background-size: 50px 50px;
            z-index: -1;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5), 0 0 10px var(--primary-color);
            border-top: 5px solid var(--primary-color);
            text-align: center;
        }

        h1 {
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.9rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 2px solid #333;
            border-radius: 8px;
            color: white;
            font-family: 'Prompt';
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn-spin {
            background: var(--primary-color);
            color: black;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-spin:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 222, 0, 0.4);
        }

        .btn-spin:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #result-area {
            margin-top: 2rem;
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .drink-card {
            background: #252525;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid var(--primary-color);
            text-align: left;
        }

        .drink-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .drink-type {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .description {
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .user-greeting {
            font-weight: 300;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        /* Roulette Animation */
        .spinning-text {
            font-style: italic;
            color: var(--primary-color);
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BCU FORMULA</h1>
    <div class="subtitle">DRINK RANDOMIZER VOL.1</div>

    <div id="setup-area">
        <div class="input-group">
            <input type="text" id="username" placeholder="กรอกชื่อของคุณนักซิ่ง..." autocomplete="off">
        </div>
        <button class="btn-spin" onclick="startSpin()">START ENGINE</button>
    </div>

    <div id="result-area">
        <div class="user-greeting" id="display-name"></div>
        <div id="roulette" class="spinning-text" style="display:none;">กำลังสุ่มเมนู...</div>
        <div id="final-drink" class="drink-card">
            <div class="drink-name" id="d-name"></div>
            <div class="drink-type" id="d-type"></div>
            <div class="description" id="d-desc"></div>
        </div>
        <button class="btn-spin" style="margin-top:20px; font-size: 0.9rem;" onclick="resetGame()">สุ่มใหม่</button>
    </div>
</div>

<script>
    const drinks = [
        // DRAFT BEER
        { name: "Hoegaarden Rosée / Original", type: "Draft Beer Kegs", desc: "เบียร์สดถัง (Keg) รสนุ่มระดับตำนาน เลือกได้ทั้งแบบต้นตำรับหรือโรเซ่หวานอมเปรี้ยว" },
        { name: "Singha Reserve", type: "Draft Beer Kegs", desc: "เบียร์สดพรีเมียม สัมผัสความนุ่มลึกระดับมาสเตอร์พีซของสิงห์" },
        { name: "Asahi Super Dry", type: "Draft Beer Kegs", desc: "เย็นจัด สไตล์ญี่ปุ่น รสสัมผัส Crisp คลีน ดื่มง่ายแต่ทรงพลัง" },
        { name: "Paulaner Hefe-Weißbier", type: "Draft Beer Kegs", desc: "คราฟต์เบียร์สไตล์เยอรมันแท้ๆ บอดี้แน่น กลิ่นหอมเป็นเอกลักษณ์" },
        { name: "Guinness Stout", type: "Draft Beer Kegs", desc: "เบียร์ดำ รสนุ่มลึก บอดี้ครีมมี่สะใจคนรักความเข้มข้น" },
        
        // HARD LIQUOR
        { name: "The Macallan 12 Years Old", type: "Hard Liquor (Spirits)", desc: "Single Malt Scotch ชั้นเลิศ บ่มเพาะความนุ่มนวลและกลิ่นไม้โอ๊คมานานกว่าทศวรรษ" },
        { name: "Glenfiddich 15 Years Old", type: "Hard Liquor (Spirits)", desc: "Single Malt ที่มีความซับซ้อนของกลิ่นน้ำผึ้งและผลไม้แห้ง นุ่มนวลเกินบรรยาย" },
        { name: "Maker's Mark", type: "Hard Liquor (Spirits)", desc: "Kentucky Bourbon รสเข้มแต่กลมกล่อม มีเอกลักษณ์ที่ความหวานปลายลิ้น" },
        { name: "Grey Goose", type: "Hard Liquor (Spirits)", desc: "Premium Vodka ระดับโลก กลั่นอย่างพิถีพิถันเพื่อความบริสุทธิ์สูงสุด" },
        { name: "Hendrick's Gin", type: "Hard Liquor (Spirits)", desc: "Artisan Gin กลิ่นกุหลาบและแตงกวา ให้ความสดชื่นที่ไม่เหมือนใคร" },
        { name: "Don Julio Reposado", type: "Hard Liquor (Spirits)", desc: "Tequila ระดับพรีเมียม บ่มจนได้สีทองอำพัน รสชาติร้อนแรงแต่สมดุล" }
    ];

    function startSpin() {
        const nameInput = document.getElementById('username');
        const name = nameInput.value.trim();

        if (!name) {
            alert("กรุณากรอกชื่อก่อนเข้างานครับ!");
            return;
        }

        document.getElementById('setup-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('display-name').innerText = `ยินดีต้อนรับคุณ ${name}, เครื่องดื่มของคุณคือ...`;
        
        const roulette = document.getElementById('roulette');
        const finalDrink = document.getElementById('final-drink');
        
        roulette.style.display = 'block';
        finalDrink.style.display = 'none';

        // Simulation ของการสุ่มให้ดูตื่นเต้น
        setTimeout(() => {
            const randomIndex = Math.floor(Math.random() * drinks.length);
            const drink = drinks[randomIndex];

            document.getElementById('d-name').innerText = drink.name;
            document.getElementById('d-type').innerText = drink.type;
            document.getElementById('d-desc').innerText = drink.desc;

            roulette.style.display = 'none';
            finalDrink.style.display = 'block';
        }, 1500);
    }

    function resetGame() {
        document.getElementById('setup-area').style.display = 'block';
        document.getElementById('result-area').style.display = 'none';
        document.getElementById('username').value = '';
    }
</script>

</body>
</html>
