<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCU FORMULA CONCERT | VIP Drink Roulette</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090b;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --accent-glow: #3b82f6;
            --accent-glow-secondary: #8b5cf6;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-highlight: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08), transparent 25%);
        }

        /* Concert Stage Lighting Effect */
        .stage-light {
            position: absolute;
            top: -10vh;
            width: 100vw;
            height: 40vh;
            background: radial-gradient(ellipse at top, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            z-index: 10;
        }

        header {
            margin-bottom: 3rem;
            animation: fadeInDown 1s ease-out;
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 0.3em;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            line-height: 1.1;
            background: linear-gradient(to right, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        /* UI Panels - No Borders, Glassmorphism */
        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        .input-group {
            margin-bottom: 2rem;
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.5rem;
            font-weight: 400;
            text-align: center;
            padding: 1rem 0.5rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-bottom-color: var(--accent-glow);
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.15);
            font-weight: 300;
        }

        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 1.2rem 3rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
            background: #f8fafc;
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Roulette Animation Display */
        #roulette-display {
            display: none;
            margin: 2rem 0;
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-glow);
            height: 60px;
            line-height: 60px;
            filter: blur(0px);
            transition: filter 0.1s;
        }

        /* Result View */
        #result-view {
            display: none;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        .attendee-name {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-weight: 300;
        }

        .attendee-name span {
            color: #fff;
            font-weight: 600;
        }

        .drink-category {
            font-size: 0.8rem;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            background: var(--glass-highlight);
            display: inline-block;
            margin-bottom: 1.5rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 600;
        }

        .drink-title {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            line-height: 1.2;
            color: #fff;
        }

        .ingredients-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: left;
            margin-top: 1rem;
        }

        .ingredients-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ingredients-title::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .ingredients-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #e4e4e7;
            font-weight: 300;
        }

        .ingredients-text strong {
            color: #fff;
            font-weight: 600;
        }

        .reset-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            margin-top: 2rem;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 4px;
            transition: color 0.3s;
        }

        .reset-btn:hover {
            color: #fff;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        @media (max-width: 480px) {
            h1 { font-size: 2.2rem; }
            .panel { padding: 2rem 1.5rem; }
            .drink-title { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="stage-light"></div>

    <div class="container">
        <header>
            <span class="subtitle">Exclusive VIP Lounge</span>
            <h1>BCU FORMULA<br>CONCERT</h1>
        </header>

        <div class="panel" id="main-panel">
            <div id="input-view">
                <div class="input-group">
                    <input type="text" id="username" placeholder="กรอกชื่อของคุณ..." autocomplete="off">
                </div>
                <button class="btn" onclick="startRoulette()">
                    Random Beverage
                </button>
            </div>

            <div id="roulette-display">กำลังรันระบบสุ่ม...</div>

            <div id="result-view">
                <div class="attendee-name">สำหรับ VIP: <span id="display-name">Name</span></div>
                <div class="drink-category" id="display-category">Category</div>
                <h2 class="drink-title" id="display-drink">Drink Name</h2>
                
                <div class="ingredients-box">
                    <div class="ingredients-title">Tasting Notes & Ingredients</div>
                    <div class="ingredients-text" id="display-ingredients">
                        Ingredients go here...
                    </div>
                </div>

                <button class="reset-btn" onclick="resetApp()">สุ่มใหม่อีกครั้ง</button>
            </div>
        </div>
    </div>

    <script>
        // ข้อมูลเครื่องดื่มที่ปรับปรุงรายละเอียดและส่วนผสมแบบเจาะลึกระดับมืออาชีพ
        const drinksData = [
            {
                name: "Hoegaarden Rosée / Original",
                type: "Draft Beer Kegs",
                category_th: "เบียร์สดถัง (Keg)",
                ingredients: "<strong>Original:</strong> เบียร์ข้าวสาลีสไตล์เบลเยียม (Witbier) หมักผสานเปลือกส้มคูราเซา (Curaçao Orange Peel) และเมล็ดผักชี (Coriander) ให้กลิ่นหอมสดชื่นแบบซิตรัส<br><br><strong>Rosée:</strong> อินฟิวส์เพิ่มความหอมหวานจากราสป์เบอร์รีแท้และสารสกัดจากผลไม้ตระกูลเบอร์รี ให้บอดี้สีชมพูอ่อน ดื่มง่าย สดชื่น ไม่ขม",
                color: "#f472b6"
            },
            {
                name: "Singha Reserve",
                type: "Draft Beer Kegs",
                category_th: "เบียร์สดพรีเมียม",
                ingredients: "พรีเมียมลาเกอร์ที่ใช้ <strong>ฮอปส์คุณภาพสูง (Premium Hops)</strong> ผ่านกระบวนการหมักบ่มที่ยาวนานกว่าปกติ (Longer Maturation) มอลต์เต็มเมล็ดคัดพิเศษให้ความหอมระดับคาราเมลอ่อนๆ บอดี้มีความนุ่มลึก (Smooth & Rich) จบด้วยความคลีนและสดชื่นระดับไฮเอนด์",
                color: "#fbbf24"
            },
            {
                name: "Asahi Super Dry",
                type: "Draft Beer Kegs",
                category_th: "เย็นจัด สไตล์ญี่ปุ่น",
                ingredients: "ดรายเบียร์สไตล์ญี่ปุ่น (Karakuchi) หมักด้วย <strong>ยีสต์สายพันธุ์พิเศษ (Asahi Yeast Strain No. 318)</strong> ผสมผสานข้าวบาร์เลย์มอลต์ ข้าวโพด ข้าว และฮอปส์ชั้นเลิศ โดดเด่นที่กระบวนการหมักที่ดึงน้ำตาลออกจนหมด ให้รสชาติที่คมชัด สดชื่น และจบแบบคลีนๆ ไร้รสหวานตกค้าง",
                color: "#e4e4e7"
            },
            {
                name: "Paulaner Hefe-Weißbier",
                type: "Draft Beer Kegs",
                category_th: "คราฟต์เบียร์สไตล์เยอรมัน",
                ingredients: "คราฟต์เบียร์ข้าวสาลีสไตล์เยอรมันแท้แบบไม่กรองยีสต์ (Unfiltered) ใช้วัตถุดิบตามกฎหมายบริสุทธิ์ของเยอรมัน ประกอบด้วย <strong>Wheat Malt, Munich Malt, ฮอปส์พันธุ์ Herkules</strong> และยีสต์คัดพิเศษ หมักตามธรรมชาติให้โน้ตความหอมของกล้วย กานพลู (Clove) และมะม่วงสุก ฟองหนานุ่มเนียนละเอียด",
                color: "#f59e0b"
            },
            {
                name: "Guinness Stout",
                type: "Draft Beer Kegs",
                category_th: "เบียร์ดำ รสนุ่มลึก",
                ingredients: "ไอริชสแตาต์ระดับตำนาน โดดเด่นด้วยการใช้ <strong>ข้าวบาร์เลย์คั่วบด (Roasted Barley)</strong> ที่อุณหภูมิ 232 องศาเซลเซียส ผสมกับมอลต์ ฮอปส์ และยีสต์สายพันธุ์เฉพาะของกูอินเนสส์ อัดก๊าซ <strong>ไนโตรเจน (Nitrogen)</strong> เพื่อสร้างฟองครีม 'Surge and Settle' ที่นุ่มนวลราวกับกำมะหยี่ ให้โน้ตของกาแฟเอสเปรสโซ่และดาร์กช็อกโกแลต",
                color: "#27272a"
            },
            {
                name: "The Macallan 12 Years Old",
                type: "Hard Liquor (Spirits)",
                category_th: "Single Malt Scotch",
                ingredients: "ซิงเกิลมอลต์สก็อตช์วิสกี้ระดับอัลตร้าพรีเมียม บ่มใน <strong>ถังไม้โอ๊คปรุงรสเชอร์รี่ (Oloroso Sherry Seasoned Oak Casks)</strong> จากเมือง Jerez ประเทศสเปน 100% ให้สีทองมะฮอกกานีธรรมชาติ โดดเด่นด้วยรสชาติที่ซับซ้อนของผลไม้แห้ง (Dried Fruits) เครื่องเทศอบ (Baking Spices) ช็อกโกแลต และวานิลลาที่อบอวลยาวนาน",
                color: "#d97706"
            },
            {
                name: "Glenfiddich 15 Years Old",
                type: "Hard Liquor (Spirits)",
                category_th: "Single Malt",
                ingredients: "ซิงเกิลมอลต์ที่ใช้เทคนิค <strong>Solera Vat</strong> นวัตกรรมเฉพาะที่บ่มผสมผสานวิสกี้ใน 3 ถัง: ถังโอ๊คยุโรป (Sherry), ถังโอ๊คอเมริกัน (Bourbon) และถังโอ๊คใหม่ (New Oak) วิสกี้ใน Solera Vat จะไม่เคยถูกถ่ายออกจนหมด ให้ความซับซ้อนและนุ่มนวล หอมกลิ่นน้ำผึ้งวอลนัต ซินนามอน และมาร์ซิแพน (Marzipan)",
                color: "#b45309"
            },
            {
                name: "Maker's Mark",
                type: "Hard Liquor (Spirits)",
                category_th: "Kentucky Bourbon",
                ingredients: "เคนทักกีเบอร์เบินผลิตแบบ Small Batch หัวใจสำคัญคือการใช้ <strong>ข้าวสาลีฤดูหนาวสีแดง (Soft Red Winter Wheat)</strong> แทนข้าวไรย์ ผสมกับข้าวโพดสีเหลืองและมอลต์บาร์เลย์ ใช้น้ำบริสุทธิ์จากทะเลสาบหินปูน บ่มในถังไม้โอ๊คขาวอเมริกันที่ผ่านการเผาไฟ (Charred) ให้รสชาติที่นุ่มนวล ไม่บาดคอ หอมหวานกลิ่นวานิลลา คาราเมลเข้มข้น และไม้โอ๊คคั่ว",
                color: "#dc2626"
            },
            {
                name: "Grey Goose",
                type: "Hard Liquor (Spirits)",
                category_th: "Premium Vodka",
                ingredients: "วอดก้าระดับพรีเมียมจากฝรั่งเศส (Cognac Region) กลั่นแบบ Single-Origin จาก <strong>ข้าวสาลีฤดูหนาวแคว้นปิการ์ดี (Picardy Soft Winter Wheat)</strong> ระดับเดียวกับที่ใช้ทำขนมปังฝรั่งเศสชั้นเลิศ และ <strong>น้ำแร่ธรรมชาติจากแหล่งน้ำพุ Gensac-la-Pallue</strong> ผ่านการกลั่นอย่างพิถีพิถันจนได้ความบริสุทธิ์ไร้ที่ติ บอดี้เนียนนุ่ม ให้โน้ตความหวานของอัลมอนด์บางๆ",
                color: "#93c5fd"
            },
            {
                name: "Hendrick's Gin",
                type: "Hard Liquor (Spirits)",
                category_th: "Artisan Gin",
                ingredients: "อาร์ติซานจินสไตล์สก็อตช์ที่ฉีกกฎเกณฑ์ กลั่นในหม้อต้มทองแดงแบบโบราณ เอกลักษณ์คือการ <strong>อินฟิวส์ (Infusion) ด้วยสารสกัดจากดอกกุหลาบดามัสก์ (Damascena Rose) และแตงกวาคัดพิเศษ</strong> ผสานพฤกษชาติ 11 ชนิด เช่น จูนิเปอร์เบอร์รี่ เปลือกส้ม เลมอน คาโมมายล์ และรากออร์ริส ให้กลิ่นหอมดอกไม้ สดชื่น และซับซ้อนอย่างน่าประหลาดใจ",
                color: "#10b981"
            },
            {
                name: "Don Julio Reposado",
                type: "Hard Liquor (Spirits)",
                category_th: "Tequila",
                ingredients: "เตกีล่าระดับซูเปอร์พรีเมียม ผลิตจาก <strong>บลูเวเบอร์อากาเว่ (Blue Weber Agave) 100%</strong> ที่ปลูกบนที่ราบสูงของฮาลิสโก (Jalisco) ประเทศเม็กซิโก นำไปอบในเตาอิฐแบบดั้งเดิมนาน 72 ชั่วโมง และบ่มในถังไม้โอ๊คอเมริกันเกรดพรีเมียมนาน 8 เดือน (นานกว่ามาตรฐาน Reposado ทั่วไป) หอมกลิ่นเลมอน เครื่องเทศ แฝงด้วยรสช็อกโกแลตเข้มข้น วานิลลา และซินนามอนอุ่นๆ",
                color: "#fcd34d"
            }
        ];

        const inputView = document.getElementById('input-view');
        const rouletteDisplay = document.getElementById('roulette-display');
        const resultView = document.getElementById('result-view');
        const usernameInput = document.getElementById('username');
        
        let isSpinning = false;

        function startRoulette() {
            const name = usernameInput.value.trim();
            if (!name) {
                usernameInput.style.borderBottomColor = '#ef4444';
                setTimeout(() => usernameInput.style.borderBottomColor = 'rgba(255, 255, 255, 0.1)', 1000);
                usernameInput.focus();
                return;
            }

            if (isSpinning) return;
            isSpinning = true;

            // สลับ View
            inputView.style.display = 'none';
            rouletteDisplay.style.display = 'block';

            // เอฟเฟกต์สุ่มชื่อเครื่องดื่มเร็วๆ (Slot Machine Effect)
            let counter = 0;
            const spinDuration = 2500; // 2.5 วินาที
            const intervalTime = 50; // เปลี่ยนทุกๆ 50ms
            const maxCycles = spinDuration / intervalTime;

            const spinInterval = setInterval(() => {
                const randomVisualDrink = drinksData[Math.floor(Math.random() * drinksData.length)];
                rouletteDisplay.innerText = randomVisualDrink.name;
                rouletteDisplay.style.filter = `blur(${Math.random() * 2}px)`; // เพิ่มเอฟเฟกต์เบลอขณะสุ่ม
                
                counter++;
                if (counter >= maxCycles) {
                    clearInterval(spinInterval);
                    rouletteDisplay.style.filter = 'blur(0px)';
                    showResult(name);
                }
            }, intervalTime);
        }

        function showResult(name) {
            // สุ่มผลลัพธ์สุดท้าย
            const finalDrink = drinksData[Math.floor(Math.random() * drinksData.length)];

            // ปิดตัวแสดงการสุ่ม เปิดหน้าผลลัพธ์
            rouletteDisplay.style.display = 'none';
            resultView.style.display = 'block';

            // ใส่ข้อมูลลงใน UI
            document.getElementById('display-name').innerText = name.toUpperCase();
            document.getElementById('display-category').innerText = `${finalDrink.type} | ${finalDrink.category_th}`;
            document.getElementById('display-category').style.color = finalDrink.color;
            document.getElementById('display-drink').innerText = finalDrink.name;
            document.getElementById('display-ingredients').innerHTML = finalDrink.ingredients;

            isSpinning = false;
        }

        function resetApp() {
            resultView.style.display = 'none';
            inputView.style.display = 'block';
            usernameInput.value = '';
            usernameInput.focus();
        }

        // รองรับการกด Enter
        usernameInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                startRoulette();
            }
        });
    </script>
