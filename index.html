<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCU FORMULA CONCERT - DRINK RANDOMIZER</title>
    <!-- ใช้ฟอนต์ไม่มีหัว (Prompt) ที่นิยมในงานดีไซน์สมัยใหม่ -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-yellow: #ffcc00;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-gray: #b0b0b0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--dark-bg);
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(circle at center, #252525 0%, #121212 100%);
        }

        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            padding: 2rem;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 204, 0, 0.2);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--primary-yellow);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: var(--text-gray);
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            width: 80%;
            padding: 12px 20px;
            background: #2a2a2a;
            border: 2px solid #333;
            border-radius: 50px;
            color: white;
            font-family: 'Prompt', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-yellow);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
        }

        .btn-random {
            background: var(--primary-yellow);
            color: black;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s transform, 0.3s box-shadow;
            font-family: 'Prompt', sans-serif;
            text-transform: uppercase;
        }

        .btn-random:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
        }

        .btn-random:disabled {
            background: #555;
            cursor: not-allowed;
        }

        /* Result Section */
        #result-area {
            display: none;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #333;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .greeting {
            font-size: 1.2rem;
            color: var(--text-gray);
            margin-bottom: 1rem;
        }

        .drink-name {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--primary-yellow);
            margin-bottom: 0.5rem;
        }

        .drink-desc {
            font-size: 1rem;
            color: #fff;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .ingredients {
            text-align: left;
            background: #181818;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.85rem;
        }

        .ingredients-title {
            color: var(--primary-yellow);
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }

        /* Slot Machine Animation */
        #loading {
            display: none;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-yellow);
            margin: 20px 0;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BCU FORMULA</h1>
    <p class="subtitle">EXCLUSIVE DRINK SELECTION</p>

    <div id="setup-area">
        <div class="input-group">
            <input type="text" id="username" placeholder="กรอกชื่อของคุณที่นี่..." autocomplete="off">
        </div>
        <button class="btn-random" onclick="startRandom()">สุ่มเครื่องดื่มคืนนี้</button>
    </div>

    <div id="loading">กำลังเตรียมเครื่องดื่ม...</div>

    <div id="result-area">
        <div class="greeting">คุณ <span id="display-name" style="color: white;"></span> คืนนี้คุณได้...</div>
        <div id="drink-display">
            <div class="drink-name" id="res-name"></div>
            <div class="drink-desc" id="res-type"></div>
            <div class="ingredients">
                <span class="ingredients-title">รายละเอียด/ประวัติ:</span>
                <span id="res-info"></span>
            </div>
        </div>
        <br>
        <button class="btn-random" style="padding: 10px 25px; font-size: 0.9rem;" onclick="resetGame()">สุ่มใหม่</button>
    </div>

    <div class="footer">BCU Formula Concert x Private Lounge</div>
</div>

<script>
    const drinks = [
        { name: "Hoegaarden Rosée", type: "เบียร์สดถัง (Keg)", info: "เบียร์ไวเซ่นผสมราสเบอร์รี่ ให้รสชาติหวานอมเปรี้ยว สดชื่น เหมาะกับการเริ่มต้นค่ำคืน" },
        { name: "Singha Reserve", type: "เบียร์สดพรีเมียม", info: "เบียร์ลาเกอร์ระดับพรีเมียมที่ใช้มอลต์แท้ 100% ให้สัมผัสนุ่มและมีกลิ่นหอมเฉพาะตัว" },
        { name: "Asahi Super Dry", type: "เย็นจัด สไตล์ญี่ปุ่น", info: "เบียร์ที่มีความซ่าและรสสัมผัสที่เฉียบคม (Karakuchi) จบได้สะอาดลิ้น" },
        { name: "Paulaner Hefe-Weißbier", type: "คราฟต์เบียร์สไตล์เยอรมัน", info: "เบียร์ข้าวสาลีที่ไม่ผ่านการกรอง มีกลิ่นคล้ายกล้วยและกานพลูอันเป็นเอกลักษณ์จากมิวนิก" },
        { name: "Guinness Stout", type: "เบียร์ดำ รสนุ่มลึก", info: "เบียร์ดำระดับตำนานจากไอร์แลนด์ เนื้อสัมผัสเนียนนุ่มเหมือนครีม พร้อมรสคั่วของมอลต์" },
        { name: "The Macallan 12 Years Old", type: "Single Malt Scotch", info: "วิสกี้ชั้นเลิศบ่มในถังเชอร์รี่โอ๊ค ให้กลิ่นผลไม้แห้ง เครื่องเทศ และความหวานของทอฟฟี่" },
        { name: "Glenfiddich 15 Years Old", type: "Single Malt", info: "บ่มในถังไม้โอ๊คสามชนิด (Solera System) ให้ความนุ่มนวลซับซ้อน กลิ่นน้ำผึ้งและวานิลลา" },
        { name: "Maker's Mark", type: "Kentucky Bourbon", info: "เบอร์เบิ้นวิสกี้ที่ใช้ข้าวสาลีแดงแทนไรน์ รสชาติจึงมีความหวานนุ่มนวลและละมุนกว่าปกติ" },
        { name: "Grey Goose", type: "Premium Vodka", info: "วอดก้าจากฝรั่งเศส ผลิตจากข้าวสาลีคุณภาพดีที่สุด กรองผ่านหินปูนธรรมชาติ สะอาดและนุ่มนวล" },
        { name: "Hendrick's Gin", type: "Artisan Gin", info: "จินพรีเมียมที่มีส่วนผสมแปลกใหม่จากกุหลาบบัลแกเรียและแตงกวา ให้กลิ่นหอมดอกไม้อันโดดเด่น" },
        { name: "Don Julio Reposado", type: "Tequila", info: "เตกีล่าที่บ่มในถังไม้โอ๊คขาวนาน 8 เดือน ให้รสสัมผัสของดาร์กช็อกโกแลตและวานิลลา" }
    ];

    function startRandom() {
        const name = document.getElementById('username').value;
        if (!name) {
            alert("กรุณากรอกชื่อก่อนเริ่มสุ่มครับ!");
            return;
        }

        document.getElementById('setup-area').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        // หน่วงเวลาจำลองการสุ่มให้ดูตื่นเต้น
        setTimeout(() => {
            const randomIndex = Math.floor(Math.random() * drinks.length);
            const selected = drinks[randomIndex];

            document.getElementById('display-name').innerText = name;
            document.getElementById('res-name').innerText = selected.name;
            document.getElementById('res-type').innerText = selected.type;
            document.getElementById('res-info').innerText = selected.info;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
        }, 1500);
    }

    function resetGame() {
        document.getElementById('result-area').style.display = 'none';
        document.getElementById('setup-area').style.display = 'block';
        document.getElementById('username').value = '';
    }
</script>

</body>
</html>
